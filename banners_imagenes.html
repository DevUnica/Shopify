<style>

/* ============================================================
   MARCAS FAVORITAS
   ============================================================ */

.marcas-favoritas {
  width: 100%;
  background: #ffffff;
  padding: 65px 0 55px;
  overflow: hidden;
}

.marcas-favoritas__container {
  width: 100%;
  max-width: 1550px;
  margin: 0 auto;
  padding: 0 65px;
  box-sizing: border-box;
}


/* ============================================================
   TÍTULO
   ============================================================ */

.marcas-favoritas__title {
  margin: 0 0 45px;

  text-align: center;

  font-family: 'Varela Round', sans-serif;

  font-size: 42px;
  line-height: 1.15;

  font-weight: 400;

  letter-spacing: -1.2px;

  color: #181818;
}

.marcas-favoritas__title .orange {
  color: #7fb32c;
}


/* ============================================================
   SLIDER
   ============================================================ */

.marcas-favoritas__slider {
  position: relative;
  width: 100%;

  overflow: hidden;

  padding: 10px 0;
}


.marcas-favoritas__track {
  display: flex;

  width: 100%;

  transition:
    transform 0.65s cubic-bezier(.22, .61, .36, 1);

  will-change: transform;
}


/* ============================================================
   CADA SLIDE
   ============================================================ */

.marcas-favoritas__slide {
  flex: 0 0 100%;

  width: 100%;

  display: grid;

  /*
     DESKTOP
     6 columnas x 2 filas
     = 12 marcas
  */

  grid-template-columns:
    repeat(6, minmax(0, 1fr));

  grid-template-rows:
    repeat(2, 120px);

  gap: 22px;

  padding:
    10px 45px;

  box-sizing: border-box;
}


/* ============================================================
   TARJETA DE MARCA
   ============================================================ */

.marca-logo {
  position: relative;

  width: 100%;
  height: 100%;

  min-height: 100px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 12px;

  box-sizing: border-box;

  background: #ffffff;

  border: 1px solid #eeeeee;

  border-radius: 14px;

  overflow: hidden;

  transform:
    translateY(0)
    scale(1);

  box-shadow:
    0 3px 12px rgba(0, 0, 0, 0.035);

  transition:
    transform 0.35s cubic-bezier(.22, .61, .36, 1),
    box-shadow 0.35s ease,
    border-color 0.35s ease,
    background 0.35s ease;
}



/* ============================================================
   HOVER
   ============================================================ */

.marca-logo:hover {

  transform:
    translateY(-6px)
    scale(1.02);

  border-color:
    rgba(127, 179, 44, 0.40);

  background:
    #ffffff;

  box-shadow:
    0 14px 30px rgba(0, 0, 0, 0.09),
    0 5px 15px rgba(127, 179, 44, 0.10);
}


.marca-logo:hover::before {
  width: 55%;
}


/* ============================================================
   LOGO
   ============================================================ */

.marca-logo img {

  display: block;

  width: 100%;
  height: 100%;

  max-width: 190px;
  max-height: 82px;

  object-fit: contain;
  object-position: center;

  transform:
    scale(1);

  transition:
    transform 0.4s cubic-bezier(.22, .61, .36, 1);
}


.marca-logo:hover img {

  transform:
    scale(1.08);
}


/* ============================================================
   FLECHAS
   ============================================================ */

.marcas-favoritas__arrow {

  position: absolute;

  top: 50%;

  transform:
    translateY(-50%);

  width: 50px;
  height: 50px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0;

  border:
    1px solid #eeeeee;

  border-radius: 50%;

  background:
    rgba(255, 255, 255, 0.98);

  color:
    #7fb32c;

  box-shadow:
    0 5px 18px rgba(0, 0, 0, 0.10);

  cursor: pointer;

  z-index: 10;

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    background 0.25s ease,
    border-color 0.25s ease;
}


.marcas-favoritas__arrow:hover {

  transform:
    translateY(-50%)
    scale(1.10);

  background:
    #ffffff;

  border-color:
    rgba(127, 179, 44, 0.35);

  box-shadow:
    0 8px 25px rgba(127, 179, 44, 0.18);
}


.marcas-favoritas__arrow span {

  font-size: 34px;

  font-weight: 300;

  line-height: 1;

  margin-top: -3px;
}


.marcas-favoritas__arrow--prev {
  left: 0;
}


.marcas-favoritas__arrow--next {
  right: 0;
}


/* ============================================================
   INDICADORES
   ============================================================ */

.marcas-favoritas__dots {

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 7px;

  margin-top: 25px;
}


.marcas-favoritas__dot {

  width: 8px;
  height: 8px;

  padding: 0;

  border: 0;

  border-radius: 20px;

  background:
    #d7d7d7;

  cursor: pointer;

  transition:
    width 0.3s ease,
    background 0.3s ease;
}


.marcas-favoritas__dot.active {

  width: 28px;

  background:
    #7fb32c;
}

/* ============================================================

@media (prefers-reduced-motion: reduce) {

  }

}

<script>

(function () {

  /* ==========================================================
     SECCIÓN
     ========================================================== */

  const section =
    document.getElementById(
      'marcas-favoritas-{{ section.id }}'
    );

  if (!section) return;


  /* ==========================================================
     ELEMENTOS
     ========================================================== */

  const track =
    section.querySelector(
      '.marcas-favoritas__track'
    );


  const allLogos =
    Array.from(
      section.querySelectorAll(
        '.marca-logo'
      )
    );


  const dotsContainer =
    section.querySelector(
      '.marcas-favoritas__dots'
    );


  const prev =
    section.querySelector(
      '.marcas-favoritas__arrow--prev'
    );


  const next =
    section.querySelector(
      '.marcas-favoritas__arrow--next'
    );


  let slides = [];

  let current = 0;

  let autoplay = null;

  let resizeTimer = null;


  /* ==========================================================
     DETERMINAR CUÁNTAS MARCAS VAN POR SLIDE
     ========================================================== */

  function getItemsPerSlide() {

    const width =
      window.innerWidth;


    /*
       DESKTOP
       12 marcas
    */

    if (width > 1000) {
      return 12;
    }


    /*
       TABLET
       8 marcas
    */

    if (width > 600) {
      return 8;
    }


    /*
       MÓVIL
       4 marcas
    */

    return 4;
  }


  /* ==========================================================
     CREAR SLIDES
     ========================================================== */

  function buildSlides() {

    const itemsPerSlide =
      getItemsPerSlide();


    /*
       Guardar todas las marcas
    */

    const logos =
      Array.from(allLogos);


    /*
       Limpiar track
    */

    track.innerHTML = "";


    slides = [];


    /*
       Crear nuevos slides
    */

    for (
      let i = 0;
      i < logos.length;
      i += itemsPerSlide
    ) {

      const slide =
        document.createElement('div');


      slide.className =
        'marcas-favoritas__slide';


      const group =
        logos.slice(
          i,
          i + itemsPerSlide
        );


      group.forEach(
        function (logo) {

          slide.appendChild(
            logo.cloneNode(true)
          );

        }
      );


      track.appendChild(
        slide
      );


      slides.push(
        slide
      );

    }


    /*
       Crear indicadores
    */

    dotsContainer.innerHTML = "";


    slides.forEach(
      function (_, index) {

        const dot =
          document.createElement(
            'button'
          );


        dot.className =
          'marcas-favoritas__dot';


        dot.type =
          'button';


        dot.setAttribute(
          'aria-label',
          'Página ' +
          (index + 1)
        );


        dot.addEventListener(
          'click',
          function () {

            showSlide(index);

            startAutoplay();

          }
        );


        dotsContainer.appendChild(
          dot
        );

      }
    );


    /*
       Reiniciar posición
    */

    current = 0;

    showSlide(0);

  }


  /* ==========================================================
     MOSTRAR SLIDE
     ========================================================== */

  function showSlide(index) {

    if (!slides.length) return;


    if (index < 0) {

      index =
        slides.length - 1;

    }


    if (index >= slides.length) {

      index = 0;

    }


    current = index;


    track.style.transform =
      'translate3d(-' +
      (current * 100) +
      '%, 0, 0)';


    const dots =
      dotsContainer.querySelectorAll(
        '.marcas-favoritas__dot'
      );


    dots.forEach(
      function (dot, i) {

        dot.classList.toggle(
          'active',
          i === current
        );

      }
    );

  }


  /* ==========================================================
     AUTOPLAY
     ========================================================== */

  function stopAutoplay() {

    if (autoplay) {

      clearInterval(
        autoplay
      );

      autoplay = null;

    }

  }


  function startAutoplay() {

    stopAutoplay();


    /*
       Si solo existe un slide,
       no necesitamos autoplay.
    */

    if (slides.length <= 1) {
      return;
    }


    autoplay =
      setInterval(
        function () {

          showSlide(
            current + 1
          );

        },
        6000
      );

  }


  /* ==========================================================
     BOTÓN ANTERIOR
     ========================================================== */

  prev.addEventListener(
    'click',
    function () {

      showSlide(
        current - 1
      );

      startAutoplay();

    }
  );


  /* ==========================================================
     BOTÓN SIGUIENTE
     ========================================================== */

  next.addEventListener(
    'click',
    function () {

      showSlide(
        current + 1
      );

      startAutoplay();

    }
  );


  /* ==========================================================
     PAUSAR CON MOUSE
     ========================================================== */

  section.addEventListener(
    'mouseenter',
    stopAutoplay
  );


  section.addEventListener(
    'mouseleave',
    startAutoplay
  );


  /* ==========================================================
     SWIPE MÓVIL
     ========================================================== */

  let touchStartX = 0;


  section.addEventListener(
    'touchstart',
    function (event) {

      touchStartX =
        event.changedTouches[0]
          .screenX;

      stopAutoplay();

    },
    {
      passive: true
    }
  );


  section.addEventListener(
    'touchend',
    function (event) {

      const touchEndX =
        event.changedTouches[0]
          .screenX;


      const difference =
        touchStartX -
        touchEndX;


      if (
        Math.abs(difference) > 50
      ) {

        if (difference > 0) {

          showSlide(
            current + 1
          );

        } else {

          showSlide(
            current - 1
          );

        }

      }


      startAutoplay();

    },
    {
      passive: true
    }
  );


  /* ==========================================================
     RESPONSIVE
     RECONSTRUIR AL CAMBIAR TAMAÑO
     ========================================================== */

  window.addEventListener(
    'resize',
    function () {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          function () {

            stopAutoplay();

            buildSlides();

            startAutoplay();

          },
          250
        );

    }
  );


  /* ==========================================================
     INICIALIZAR
     ========================================================== */

  buildSlides();

  startAutoplay();

})();

</script>
